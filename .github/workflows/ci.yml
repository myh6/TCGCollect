name: CI

# Only pull requests into main (each push to an open PR reruns it), plus manual runs.
# Pushing a branch without a PR doesn't run CI.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Run unit tests
        run: scripts/ci.sh
